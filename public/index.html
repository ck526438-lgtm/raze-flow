<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12040c">
  <title>RAZE Flow</title>
  <link rel="icon" href="logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="btn-menu" aria-label="Ouvrir le menu">☰</button>
    <a class="brand" href="./" aria-label="RAZE Flow">
      <img src="logo.jpg" alt="Logo RAZE">
      <span class="brand-word">FLOW</span>
    </a>
    <input id="wf-name" class="wf-name" type="text" aria-label="Nom du workflow" placeholder="Nom du workflow" maxlength="120">
    <div class="topbar-actions">
      <label class="halo-switch" title="Activer les déclencheurs (webhook, planification)">
        <input type="checkbox" id="wf-active">
        <span class="halo" aria-hidden="true"></span>
        <span class="halo-label">Actif</span>
      </label>
      <button class="btn ghost" id="btn-executions"><span class="btn-ico">🕘</span><span class="btn-txt">Exécutions</span></button>
      <button class="btn ghost" id="btn-save"><span class="btn-ico">💾</span><span class="btn-txt">Enregistrer</span></button>
      <button class="btn primary" id="btn-run"><span class="btn-ico">▶</span><span class="btn-txt">Exécuter</span></button>
      <button class="icon-btn" id="btn-more" aria-label="Plus d'actions">⋯</button>
    </div>
    <div class="menu" id="more-menu" hidden>
      <button data-action="executions" class="only-mobile">🕘 Exécutions</button>
      <button data-action="export">⬇ Exporter en JSON</button>
      <button data-action="import">⬆ Importer un JSON</button>
      <button data-action="duplicate">⧉ Dupliquer</button>
      <button data-action="delete" class="danger">🗑 Supprimer le workflow</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="nodes" role="tab">Nœuds</button>
        <button class="tab" data-tab="workflows" role="tab">Workflows</button>
        <button class="tab" data-tab="templates" role="tab">Modèles</button>
      </div>
      <div class="tab-body" id="tab-nodes">
        <input type="search" id="node-search" class="search" placeholder="Rechercher un nœud…" aria-label="Rechercher un nœud">
        <div id="palette"></div>
      </div>
      <div class="tab-body" id="tab-workflows" hidden>
        <button class="btn primary block" id="btn-new">+ Nouveau workflow</button>
        <div id="wf-list"></div>
      </div>
      <div class="tab-body" id="tab-templates" hidden>
        <div id="tpl-list"></div>
      </div>
      <p class="sidebar-foot">RAZE Flow · gratuit &amp; open source (MIT)</p>
    </aside>

    <main class="canvas-wrap" id="wrap">
      <div class="canvas" id="canvas">
        <svg class="edges" id="edges" aria-hidden="true"></svg>
        <div id="nodes"></div>
      </div>
      <div class="empty" id="empty" hidden>
        <div class="empty-title">Canevas vide</div>
        <p>Ajoutez un déclencheur depuis l'onglet « Nœuds », puis reliez les nœuds entre eux.</p>
      </div>
      <div class="zoom">
        <button id="zoom-in" aria-label="Zoom avant">+</button>
        <button id="zoom-out" aria-label="Zoom arrière">−</button>
        <button id="zoom-fit" aria-label="Tout afficher">⤢</button>
      </div>
      <div class="hint-bar" id="hint-bar" hidden></div>
    </main>

    <aside class="panel" id="panel" hidden></aside>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <section class="drawer" id="drawer" hidden aria-label="Historique des exécutions">
    <header>
      <h2>Exécutions</h2>
      <div>
        <button class="btn ghost small" id="btn-clear-exec">Vider</button>
        <button class="icon-btn" id="btn-close-drawer" aria-label="Fermer">✕</button>
      </div>
    </header>
    <div id="exec-list"></div>
  </section>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <script src="app.js"></script>
</body>
</html>
