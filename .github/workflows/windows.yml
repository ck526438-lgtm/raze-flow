name: Application Windows
on:
  push:
    branches: [main]
    paths: ['electron/**', 'src/**', 'public/**', 'package*.json', '.github/workflows/windows.yml']
  pull_request:
    paths: ['electron/**', 'src/**', 'public/**', 'package*.json', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Construire l'installateur et la version portable
        run: npm run dist:win
      - name: Test de démarrage de l'application
        shell: pwsh
        run: |
          $env:RAZE_SMOKE = '1'
          $p = Start-Process -FilePath "dist\win-unpacked\RAZE Flow.exe" -Wait -PassThru
          Write-Host "Code de sortie : $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: raze-flow-windows
          path: dist/*.exe
          if-no-files-found: error
      # Sur main : publie une Release « v<version de package.json> » si elle n'existe pas encore
      - name: Version à publier
        id: version
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then echo "publish=false" >> "$GITHUB_OUTPUT"; else echo "publish=true" >> "$GITHUB_OUTPUT"; fi
      - name: Publier la version
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: RAZE Flow ${{ steps.version.outputs.tag }}
          files: dist/*.exe
          generate_release_notes: true
          body: |
            **RAZE-Flow-Setup** : installateur Windows (raccourci sur le bureau).
            **RAZE-Flow-Portable** : version portable, sans installation.

            L'exécutable n'est pas signé : au premier lancement, Windows SmartScreen affiche un avertissement — « Informations complémentaires » puis « Exécuter quand même ».
